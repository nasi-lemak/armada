name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job runs scripts/ci.sh, which `make ci` also runs locally: what
  # passes there passes here.
  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Go that go.mod allows, and the current release (used for
        # release builds, so they include the latest standard-library fixes).
        go: [go.mod, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          check-latest: ${{ matrix.go == 'stable' }}
      - name: gofmt, vet, tidy, race tests, cross-builds
        run: scripts/ci.sh go ${{ matrix.go == 'go.mod' && '--tidy' || '' }}

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: govulncheck
        run: scripts/ci.sh vulncheck

  dashboard:
    name: Dashboard (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json
      - name: JavaScript syntax and browser smoke test
        run: scripts/ci.sh dashboard

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        run: scripts/ci.sh android
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/*/build/reports
