name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Go that go.mod allows, and the current release (used for
        # release builds, so they include the latest standard-library fixes).
        go: [go.mod, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          check-latest: ${{ matrix.go == 'stable' }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy
        if: matrix.go == 'go.mod'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Tests (race detector)
        run: go test -race -count=1 ./...
      - name: Cross-compile agents
        run: make agents
      - name: Build server and CLI for other platforms
        run: |
          for p in linux/arm64 darwin/arm64 windows/amd64 freebsd/amd64; do
            echo "building cmd/... for $p"
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/...
          done

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  dashboard:
    name: Dashboard (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json
      - name: JavaScript syntax
        run: for f in web/static/*.js; do node --check "$f"; done
      - name: Install Playwright
        working-directory: web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          go build -o armada-server ./cmd/armada-server
          ./armada-server -data-dir "$RUNNER_TEMP/armada" -admin-token ci-admin-token \
            -listen 127.0.0.1:8080 -public-url http://localhost:8080 > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - name: Smoke test
        working-directory: web/e2e
        run: node smoke.cjs http://localhost:8080 ci-admin-token
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/*/build/reports
