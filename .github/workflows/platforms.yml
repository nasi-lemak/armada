name: Platforms

# Installs the agent on real Windows, macOS and Linux machines with the
# installers customers use (install.ps1 + Windows service, install.sh +
# launchd, install.sh + systemd), then checks it enrolls, restarts from the
# dashboard and updates itself (internal/platformtest).
#
# It runs only when started by hand (Actions -> Platforms -> Run workflow),
# e.g. before a release: macOS and Windows minutes cost more.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install, restart and update the agent
        env:
          ARMADA_PLATFORM_TEST: install
        run: go test -count=1 -v -timeout 20m -run TestPlatform ./internal/platformtest
